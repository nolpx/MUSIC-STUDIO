<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MUSIC-STUDIO | 3-Column Cloud Editor</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="app-layout">
    <!-- KOLOM KIRI: Google Drive (Background, Bank Lagu, Playlist Terpilih) -->
    <aside id="col-left" class="panel panel-left"></aside>

    <!-- KOLOM TENGAH: Live Preview, Player Tes, Tombol Render & Status -->
    <main id="col-center" class="panel panel-center">
      <div id="preview-mount"></div>
      <div id="render-mount"></div>
    </main>

    <!-- KOLOM KANAN: Inspector (Tulisan & Visualizer) + Koneksi API (Terlipat) -->
    <aside id="col-right" class="panel panel-right">
      <div id="inspector-mount"></div>
      <div id="connection-mount"></div>
    </aside>
  </div>

  <!-- Urutan pemuatan modul JS -->
  <script src="js/state.js"></script>
  <script src="js/gdrive.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/inspector.js"></script>
  <script src="js/github.js"></script>
</body>
</html>
