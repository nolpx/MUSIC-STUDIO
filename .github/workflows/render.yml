name: Render Studio Musik

on:
  workflow_dispatch:
    inputs:
      bg_url:
        description: 'File atau Link Background'
        required: true
      audio_url:
        description: 'File atau Link Audio'
        required: true
      judul_teks:
        description: 'Teks di layar'
        default: ''
      efek:
        description: 'hujan / salju / tanpa_efek'
        default: 'tanpa_efek'
      vis_style:
        description: 'bar / wave / off'
        default: 'bar'
      vis_color:
        description: 'Warna Hex Visualizer'
        default: '#00ffcc'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil Kode & File Upload
        uses: actions/checkout@v4

      - name: Install FFmpeg & Font
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu file

      - name: Siapkan Bahan (File Upload atau Link URL)
        run: |
          BG="${{ github.event.inputs.bg_url }}"
          AUDIO="${{ github.event.inputs.audio_url }}"

          if [[ "$BG" == http* ]]; then
            curl -fL "$BG" -o bg_input
          else
            cp "$BG" bg_input
          fi

          if [[ "$AUDIO" == http* ]]; then
            curl -fL "$AUDIO" -o audio.mp3
          else
            cp "$AUDIO" audio.mp3
          fi

      - name: Render Video
        run: |
          python3 scripts/render.py \
            --efek "${{ github.event.inputs.efek }}" \
            --vis_style "${{ github.event.inputs.vis_style }}" \
            --vis_color "${{ github.event.inputs.vis_color }}" \
            --judul_teks "${{ github.event.inputs.judul_teks }}"

      - name: Simpan Hasil Render
        uses: actions/upload-artifact@v4
        with:
          name: hasil-video-musik
          path: output.mp4
