name: Render Studio Musik

on:
  workflow_dispatch:
    inputs:
      bg_id:
        description: 'Google Drive ID Background'
        required: true
      bg_name:
        description: 'Nama File Background'
        default: 'background'
      playlist_json:
        description: 'Daftar Lagu Terpilih (JSON)'
        required: true
      settings_json:
        description: 'Pengaturan Teks & Visualizer (JSON)'
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil Kode Proyek
        uses: actions/checkout@v4

      - name: Siapkan FFmpeg, Font & gdown (Cepat)
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ]; then
            sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu file
          fi
          pip install -q gdown

      - name: Download Bahan Terpilih & Render (Mode Turbo)
        env:
          BG_ID: ${{ github.event.inputs.bg_id }}
          BG_NAME: ${{ github.event.inputs.bg_name }}
          PLAYLIST_JSON: ${{ github.event.inputs.playlist_json }}
          SETTINGS_JSON: ${{ github.event.inputs.settings_json }}
        run: python3 scripts/render.py

      - name: Simpan Hasil Video & Chapters (Mode Uji Coba <500MB)
        uses: actions/upload-artifact@v4
        with:
          name: hasil-video-musik
          path: |
            output.mp4
            chapters.txt
